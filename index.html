<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Carrinho de Compras</title>
    <style>
        /* Estilos base mantidos idênticos ao seu layout funcional */
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .cart-container { width: 350px; background: #fff; border: 1px solid #ddd; padding: 15px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        .cart-header { font-size: 18px; font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #f9f9f9; padding-bottom: 10px; }
        .item-details span { display: block; }
        .item-name { font-size: 14px; color: #333; }
        .item-price { font-size: 14px; font-weight: bold; color: #2e7d32; margin-top: 5px; }
        .cart-total { font-size: 16px; font-weight: bold; display: flex; justify-content: space-between; margin: 20px 0; border-top: 1px solid #eee; padding-top: 15px; }
        .btn-whatsapp { background-color: #25d366; color: white; border: none; width: 100%; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .btn-whatsapp:hover { background-color: #20ba5a; }
    </style>
</head>
<body>

<div class="cart-container">
    <div class="cart-header">
        <span>🛒 Seu Carrinho de Compras</span>
    </div>

    <!-- Lista de itens que já funciona 100% -->
    <div id="cart-items-container">
        <div class="cart-item">
            <div class="item-details">
                <span class="item-name">Atualização Sistema Medianav 4.1.0</span>
                <span class="item-price">R$ 55,00</span>
            </div>
        </div>
    </div>

    <div class="cart-total">
        <span>Total:</span>
        <span id="cart-total-value">R$ 55,00</span>
    </div>

    <!-- Botão de fechar pedido com a lógica atualizada para incluir o cliente -->
    <button type="button" class="btn-whatsapp" id="btnFecharPedido">
        💬 Fechar Pedido via WhatsApp
    </button>
</div>

<script>
    document.getElementById('btnFecharPedido').addEventListener('click', function() {
        // 1. Obtém o nome do cliente logado. 
        // Altere a linha abaixo conforme o seu sistema armazena o usuário (ex: localStorage, elemento HTML na tela, etc.)
        // Exemplo buscando de um elemento HTML: document.getElementById('nome-usuario-logado').innerText
        // Exemplo genérico:
        let nomeCliente = window.usuarioLogado || localStorage.getItem('nome_cliente') || "Cliente";

        // 2. Mantém exatamente a estrutura do seu texto original acrescentando a linha do cliente
        let mensagem = "Olá! Gostaria di fechar o seguinte pedido consolidado:\n";
        mensagem += `- Cliente: ${nomeCliente}\n`;
        mensagem += "- Atualização Sistema Medianav 4.1.0 (R$ 55,00)\n\n";
        mensagem += "*Total: R$ 55,00*";

        // 3. Número de WhatsApp de destino e codificação do link
        let numeroWhatsApp = "5591999999999"; // Substitua pelo seu número com DDD
        let urlWhatsApp = `https://api.whatsapp.com/send?phone=${numeroWhatsApp}&text=${encodeURIComponent(mensagem)}`;

        // 4. Abre o WhatsApp
        window.open(urlWhatsApp, '_blank');
    });
</script>

</body>
</html>
