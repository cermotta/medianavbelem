<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel</title>
    <style>
        /* Estilos básicos de exemplo para manter a estrutura funcional */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            padding: 8px 15px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        nav a:hover {
            background-color: #555;
        }
        .btn-cadastrar {
            background-color: #007bff;
        }
        .btn-cadastrar:hover {
            background-color: #0056b3;
        }
        main {
            padding: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Minha Aplicação</div>
        <nav>
            <!-- Apenas o botão "Cadastre-se" foi mantido conforme solicitado -->
            <a href="#" class="btn-cadastrar">Cadastre-se</a>
        </nav>
    </header>

    <main>
        <h1>Bem-vindo!</h1>
        <p>O restante da aplicação continua funcionando normalmente.</p>
    </main>

</body>
</html>
