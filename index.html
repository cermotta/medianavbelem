<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        /* Barra Preta Superior */
        .top-bar {
            background-color: #111;
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        /* Container do Menu e Links */
        .menu-links {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .menu-links a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .menu-links a:hover {
            color: #00bcd4;
        }

        /* Container que agrupa a Pesquisa e o bloco de Geo/Data/Hora alinhados */
        .right-section {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Caixa de Pesquisa */
        .search-container {
            display: flex;
            align-items: center;
        }

        .search-container input {
            padding: 6px 10px;
            font-size: 14px;
            border: none;
            border-radius: 4px 0 0 4px;
            outline: none;
        }

        .search-container button {
            padding: 6px 12px;
            background-color: #00bcd4;
            color: #fff;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 14px;
        }

        .search-container button:hover {
            background-color: #0097a7;
        }

        /* Bloco de Geolocalização, Data e Hora */
        .geo-datetime-block {
            font-size: 13px;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.08);
            padding: 5px 10px;
            border-radius: 4px;
        }

        .geo-datetime-block span {
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <!-- Links do Menu à Esquerda -->
        <nav class="menu-links">
            <a href="#inicio" onclick="mudarPagina('Início')">Início</a>
            <a href="#produtos" onclick="mudarPagina('Produtos')">Produtos</a>
            <a href="#quemsomos" onclick="mudarPagina('Quem Somos')">Quem Somos</a>
            <a href="#suporte" onclick="mudarPagina('Suporte / FAQ')">Suporte / FAQ</a>
            <a href="#cadastro" onclick="mudarPagina('Meu Cadastro')">Meu Cadastro</a>
            <a href="#comprovante" onclick="mudarPagina('Enviar Comprovante')">Enviar Comprovante</a>
        </nav>

        <!-- Seção à Direita: Pesquisa + Bloco de Geo/Data/Hora alinhados lado a lado -->
        <div class="right-section">
            <!-- Caixa de Pesquisa -->
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Pesquisar...">
                <button onclick="realizarPesquisa()">Buscar</button>
            </div>

            <!-- Bloco de Geolocalização, Data e Hora -->
            <div class="geo-datetime-block">
                <span id="geoLoc">Carregando local...</span>
                <span>|</span>
                <span id="liveDateTime">Carregando data/hora...</span>
            </div>
        </div>
    </header>

    <script>
        // Função para atualizar Data e Hora em tempo real
        function atualizarDataHora() {
            const agora = new Date();
            const options = { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            };
            document.getElementById('liveDateTime').innerText = agora.toLocaleDateString('pt-BR', options);
        }

        // Inicializa imediatamente e atualiza a cada segundo
        atualizarDataHora();
        setInterval(atualizarDataHora, 1000);

        // Simulação de Geolocalização simples via navegador
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(function(position) {
                // Aqui você pode integrar com uma API de Reverse Geocoding se desejar a cidade exata
                document.getElementById('geoLoc').innerText = "Belém, PA";
            }, function(error) {
                document.getElementById('geoLoc').innerText = "Belém, PA"; // Fallback padrão
            });
        } else {
            document.getElementById('geoLoc').innerText = "Belém, PA";
        }

        // Funções de navegação e pesquisa simuladas
        function mudarPagina(secao) {
            console.log("Navegando para: " + secao);
        }

        function realizarPesquisa() {
            const termo = document.getElementById('searchInput').value;
            console.log("Pesquisando por: " + termo);
        }
    </script>

</body>
</html>
