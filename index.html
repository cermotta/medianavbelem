<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaNav Belém - Sua Solução em GPS e Multimídia</title>
    <!-- Favicon com a sua logo -->
    <link rel="icon" type="image/png" href="medianavbelem.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Insira aqui os seus estilos CSS originais */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #111827; color: #fff; }
        .topo-container { background-color: #0b0f19; display: flex; justify-content: flex-end; padding: 8px 30px; }
        .topo-info { background-color: #1f2937; border: 1px solid #374151; padding: 6px 16px; border-radius: 20px; font-size: 13px; color: #f3f4f6; display: flex; align-items: center; gap: 8px; }
        .banner { background-color: #fbbf24; padding: 25px 30px; display: flex; align-items: center; justify-content: space-between; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-box { background: #fff; padding: 10px 15px; border-radius: 8px; font-weight: 900; color: #000; font-size: 20px; text-align: center; line-height: 1.1; }
        .search-container { position: relative; width: 350px; }
        .search-container input { width: 100%; padding: 10px 20px; padding-right: 40px; border-radius: 20px; border: none; outline: none; font-size: 14px; }
        .menu { background-color: #111827; display: flex; gap: 25px; padding: 12px 30px; align-items: center; border-bottom: 2px solid #1f2937; font-size: 14px; }
        .menu a { color: #e5e7eb; text-decoration: none; font-weight: 600; }
        .menu a:hover { color: #fbbf24; }
        .hero { padding: 50px 30px; background-color: #1f2937; margin: 20px 30px; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- Topo: Local e Data/Hora -->
    <div class="topo-container">
        <div class="topo-info">
            <span id="topUserLocation"><i class="fa-solid fa-location-dot"></i> Obtendo localização...</span>
            <span>|</span>
            <span id="topUserDateTime">Carregando data e hora...</span>
        </div>
    </div>

    <!-- Banner / Cabeçalho -->
    <header class="banner">
        <div class="logo-area">
            <div class="logo-box">
                MEDIANAV<br><span style="color:#e11d48; font-size: 14px;">BELÉM</span>
            </div>
        </div>
        <div class="search-container">
            <input type="text" placeholder="Pesquisar produtos...">
        </div>
    </header>

    <!-- Menu -->
    <nav class="menu">
        <a href="#">Início</a>
        <a href="#">Produtos</a>
        <a href="#">Quem Somos</a>
        <a href="#">Suporte / FAQ</a>
        <a href="#">Meu Cadastro</a>
        <a href="#" style="color: #fbbf24;">Enviar Comprovante</a>
    </nav>

    <!-- Conteúdo -->
    <section class="hero">
        <h1>MediaNav Belém - Atualização de GPS e Multimídia Renault</h1>
        <p>Atualize seu sistema com versões oficiais, firmware, radares e pontos de interesse.</p>
    </section>

    <!-- Script de Geolocalização do Navegador e Relógio -->
    <script>
        async function carregarLocalEDataHoraTopo() {
            const atualizarRelogioTopo = () => {
                const agora = new Date();
                const meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
                const dataFormatada = `${String(agora.getDate()).padStart(2, '0')} de ${meses[agora.getMonth()]} de ${agora.getFullYear()} - ${agora.toLocaleTimeString('pt-BR')}`;
                const elementoData = document.getElementById('topUserDateTime');
                if (elementoData) elementoData.innerText = dataFormatada;
            };

            atualizarRelogioTopo();
            setInterval(atualizarRelogioTopo, 1000);

            const elementoLocal = document.getElementById('topUserLocation');
            
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    try {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=pt-BR`);
                        const data = await response.json();
                        
                        if (data && data.address) {
                            const cidade = data.address.city || data.address.town || data.address.municipality || data.address.village || "Sua Região";
                            const estadoObj = data.address.state;
                            let estado = "";
                            
                            const estadosBr = {
                                "Acre": "AC", "Alagoas": "AL", "Amapá": "AP", "Amazonas": "AM", "Bahia": "BA", "Ceará": "CE", "Distrito Federal": "DF", "Espírito Santo": "ES", "Goiás": "GO", "Maranhão": "MA", "Mato Grosso": "MT", "Mato Grosso do Sul": "MS", "Minas Gerais": "MG", "Pará": "PA", "Paraíba": "PB", "Paraná": "PR", "Pernambuco": "PE", "Piauí": "PI", "Rio de Janeiro": "RJ", "Rio Grande do Norte": "RN", "Rio Grande do Sul": "RS", "Rondônia": "RO", "Roraima": "RR", "Santa Catarina": "SC", "São Paulo": "SP", "Sergipe": "SE", "Tocantins": "TO"
                            };

                            if (estadoObj && estadosBr[estadoObj]) {
                                estado = estadosBr[estadoObj];
                            } else {
                                estado = data.address.state_code || estadoObj || "PA";
                            }

                            if (elementoLocal) {
                                elementoLocal.innerHTML = `<i class="fa-solid fa-location-dot"></i> ${cidade} - ${estado}`;
                            }
                        } else {
                            if (elementoLocal) elementoLocal.innerHTML = `<i class="fa-solid fa-location-dot"></i> Belém - PA`;
                        }
                    } catch (error) {
                        if (elementoLocal) elementoLocal.innerHTML = `<i class="fa-solid fa-location-dot"></i> Belém - PA`;
                    }
                }, (error) => {
                    if (elementoLocal) elementoLocal.innerHTML = `<i class="fa-solid fa-location-dot"></i> Belém - PA`;
                }, { timeout: 10000, maximumAge: 60000 });
            } else {
                if (elementoLocal) elementoLocal.innerHTML = `<i class="fa-solid fa-location-dot"></i> Belém - PA`;
            }
        }

        window.addEventListener('DOMContentLoaded', carregarLocalEDataHoraTopo);
    </script>
</body>
</html>
